<button pButton type="button"
  class="blue-btn flat ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only"
  label="Referenciar AR"
  [disabled]="!habilitarBotaoAbrirDialog()"
  (click)="abrirDialog()">
</button>

<p-dialog [header]="this.getLabel('Referenciar AR')" [(visible)]="mostrarDialog" [style]="{width: '80vw'}">

  <div class="ui-g">
    
    <div class="ui-g-12 referenciador-fd-ac-wrap" style="margin-bottom: 25px">
      <p-autoComplete
        [(ngModel)]="funcoesDadosSelecionadas"
        [suggestions]="funcoesDadosFiltradas"
        (completeMethod)="filtrarFuncoesDados($event)"
        field="name"
        [multiple]="true"
        [forceSelection]="true"
        [dropdown]="true"
        [completeOnFocus]="true"
        [delay]="200"
        (ngModelChange)="onFuncoesDadosSelecionadasChange()"
        [placeholder]="funcoesDadosDropdownPlaceholder()"
        [minLength]="0"
        styleClass="referenciador-fd-autocomplete">
      </p-autoComplete>
    </div>

    <div class="ui-g-12" style="margin-bottom: 25px">
      <p-multiSelect 
        name="dersMultiSelect"
        [defaultLabel]="dersMultiSelectedPlaceholder()"
        [disabled]="!funcoesDadosSelecionadas?.length"
        [options]="ders"
        [(ngModel)]="dersReferenciados"
        optionLabel="nome">
      </p-multiSelect>
    </div>

    <div class="ui-g ui-md-12" style="justify-content: flex-end; margin-bottom: 25px;">
      <div class="ui-g-2">
        <button 
          pButton type="button"
          class=" abaco-white-btn flat ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only"
          [label]="this.getLabel('Cancelar')"
          (click)="fecharDialog()">
        </button>
      </div>

      <div class="ui-g-2">
        <button 
          pButton type="button"
          class="green-btn flat ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only"
          [label]="this.getLabel('Relacionar')"
          (click)="relacionar()">
        </button>
      </div>
    </div>

  </div>

</p-dialog>
